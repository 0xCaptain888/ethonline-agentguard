version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      hardhat-toolchain:
        patterns:
          - "hardhat"
          - "@nomicfoundation/*"
          - "@typechain/*"
      testing-toolchain:
        patterns:
          - "tsx"
          - "typescript"
