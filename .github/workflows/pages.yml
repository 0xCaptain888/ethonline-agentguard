name: Deploy ETHOnline AgentGuard demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pages must be enabled once in Repository Settings → Pages.
      # This workflow intentionally does not mutate repository settings.
      - uses: actions/configure-pages@v5
      - name: Publish public evidence manifest
        run: cp evidence/ethonline-manifest.json site/ethonline-manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
